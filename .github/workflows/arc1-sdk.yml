# Independent CI gate for the ARC-1 host SDK (G0/G1). Runs the pre-existing
# suite from a clean checkout; it is not something a pass owner can waive.
name: arc1-sdk

on:
  push:
    paths: ["arc1/**", ".github/workflows/arc1-sdk.yml"]
  pull_request:
    paths: ["arc1/**", ".github/workflows/arc1-sdk.yml"]

permissions:
  contents: read

jobs:
  host-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: arc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # pass validation checks the recorded base commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y clang libegl1 libxkbcommon0 libfontconfig1
      - run: python3 -m pip install "PySide6-Essentials==6.8.1"
      - run: ./arc1 doctor
      - run: ./arc1 build examples/hello_arc1
      - run: ./arc1 test examples/hello_arc1
      - run: |
          for p in passes/ARC1-PASS-*/; do ./arc1 pass validate "$p"; done
      - run: python3 tests/run_tests.py
      - name: Workbench regression tests (R05-R09)
        run: |
          PYTHONPATH=. python3 tests/test_pass3_boot.py
          python3 tests/test_pass4_cartridge.py
          python3 tests/test_pass7_launcher.py
          python3 tests/test_r08_qt_contract.py
          python3 tests/test_r09_output.py
      - name: Workbench R10 (real Qt window, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_r10_workbench.py
      - name: Installer (Linux install/upgrade/uninstall; Windows layer via fakes)
        run: python3 tests/test_r10_installer.py
      - name: Clip (settings, messages, OpenAI call against a fake server)
        run: python3 tests/test_r10_clip.py
