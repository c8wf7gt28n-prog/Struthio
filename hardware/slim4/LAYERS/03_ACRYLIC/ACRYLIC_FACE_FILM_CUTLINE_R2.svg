<title>STRUTHIO face film R2 cutline</title>
<desc>Clear face film, 0.175 mm optical PET + 0.025 mm OCA, unprinted, viewed from the front. Coordinates are mm on the shared R21 PCB XY datum (Y down); the canvas is the case outline, the film edge sits 0.20 mm inside it. Cut paths: outline, two flap-bezel cutouts, DART relief cutout and one vent window per speaker. The display stays covered. Supplier confirms kerf/offset.</desc>
