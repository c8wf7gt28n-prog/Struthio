<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="build" content="STRUTHIO-ARCADE-1.1.0">
<meta name="description" content="STRUTHIO arcade adventure: joust your way up a tower of floating islands to the moon.">
<meta name="author" content="R.A. Peddycoart">
<meta property="og:type" content="website">
<meta property="og:title" content="STRUTHIO · ARCADE">
<meta property="og:description" content="Climb the tower. Take the six rings. Take the gold ring at the moon.">
<meta property="og:image" content="./assets/art/share-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="STRUTHIO box art: a knight on a war bird jousts a rival above floating crystal islands.">
<meta name="twitter:card" content="summary_large_image">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>STRUTHIO · ARCADE</title>
<link rel="stylesheet" href="./assets/arcade.css">
<link rel="stylesheet" href="./assets/arcade-frame.css">
</head>
<body class="is-booting">
<section id="boot" role="status" aria-live="polite" aria-label="STRUTHIO is starting">
<div class="boot-card">
<span class="boot-kicker">STRUTHIO · ARCADE</span>
<div class="boot-progress" aria-hidden="true"><i></i></div>
<p data-boot-status>LOADING</p>
<small>CLIMB TO THE MOON</small>
</div>
</section>
<main>
<div id="top-hud" role="group" aria-hidden="true">
<span id="hud-score"><i id="hud-crown" hidden aria-hidden="true"></i><b>000000</b></span>
<span id="hud-position"><span id="hud-pos-a">R</span><b id="hud-pos-av">01</b></span>
<span id="hud-ring" class="hud-obj"><i aria-hidden="true"></i><b>00/06</b></span>
<span id="hud-rival" class="hud-obj"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 13.2 2.8M13 13 2.8 2.8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><path d="M11 2h3v3M5 2H2v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4.6 9.8 6.2 11.4M11.4 9.8 9.8 11.4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><b>00</b></span>
<span id="hud-joust"><span><small><span class="full">JOUST</span><span class="short">J</span></small><b>03/11</b></span><i aria-hidden="true"></i></span>
<div id="hud-toast" role="status" aria-live="polite"></div>
</div>
<p id="hud-sr" class="sr" role="status" aria-live="polite"></p>
<div id="cabinet">
<canvas id="game" width="768" height="1152" tabindex="0" role="application" aria-label="STRUTHIO game arena. Tap either wing to flap in that direction, tap both for a strong vertical flap, and slide a wing downward to DART. Escape or a controller's Start button pauses."></canvas>
</div>
<div id="controls" role="group" aria-label="Game controls">
<span class="chord-cue" aria-hidden="true">BOTH</span>
<button type="button" data-control="LEFT_WING" aria-label="Left wing"><svg class="wing" viewBox="0 0 48 48" aria-hidden="true"><path d="M38 10C25 12 14 21 10 37c9-7 17-8 27-7-7-4-11-8-14-13 6 2 10 1 15-7Z"/></svg><span class="sr">Left wing</span></button>
<button type="button" data-control="RIGHT_WING" aria-label="Right wing"><svg class="wing" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 10c13 2 24 11 28 27-9-7-17-8-27-7 7-4 11-8 14-13-6 2-10 1-15-7Z"/></svg><span class="sr">Right wing</span></button>
</div>
</main>
<section id="title-screen" class="is-home" aria-label="STRUTHIO start screen" style="--title-art:url('./assets/art/hero-art.webp')">
<img id="title-art" src="./assets/art/hero-art.webp" alt="STRUTHIO box art: a knight on a war bird jousts a rival above floating crystal islands under the moon." fetchpriority="high">
<div id="title-menu">
<nav id="title-actions" aria-label="Start options"></nav>
<p id="title-note" role="status" aria-live="polite"></p>
</div>
</section>
<div id="frame" aria-hidden="true">
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="fr-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c2"/><stop offset=".45" stop-color="#f7b43a"/><stop offset="1" stop-color="#b86410"/></linearGradient>
<linearGradient id="fr-blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#2f7dff"/></linearGradient>
<linearGradient id="fr-metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b212d"/><stop offset="1" stop-color="#07090e"/></linearGradient>
<symbol id="fr-star" viewBox="-10 -10 20 20"><path d="M0-10 2.2-2.2 10 0 2.2 2.2 0 10-2.2 2.2-10 0-2.2-2.2Z" fill="url(#fr-gold)"/><circle r="1.3" fill="#fff6d8"/></symbol>
</defs></svg>
<i class="fr-line fr-out"></i><i class="fr-line fr-in"></i>
<i class="fr-rail fr-l"></i><i class="fr-rail fr-r"></i>
<svg class="fr-crest fr-top" viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M0 0H240L212 30H28Z" fill="url(#fr-metal)"/><path d="M0 1.5H6L30 27H210L234 1.5H240" fill="none" stroke="url(#fr-gold)" stroke-width="2"/><g fill="url(#fr-blue)"><path d="M70 8H104L100 13H66Z"/><path d="M78 16H104L100 21H74Z" opacity=".75"/><path d="M170 8H136L140 13H174Z"/><path d="M162 16H136L140 21H166Z" opacity=".75"/></g></svg>
<svg class="fr-crest fr-bot" viewBox="0 0 240 40" preserveAspectRatio="none"><path d="M0 40H240L212 10H28Z" fill="url(#fr-metal)"/><path d="M0 38.5H6L30 13H210L234 38.5H240" fill="none" stroke="url(#fr-gold)" stroke-width="2"/><g fill="url(#fr-blue)" opacity=".8"><path d="M76 26H104L100 31H72Z"/><path d="M164 26H136L140 31H168Z"/></g></svg>
<svg class="fr-gem fr-gem-top"><use href="#fr-star"/></svg><svg class="fr-gem fr-gem-bot"><use href="#fr-star"/></svg>
<svg class="fr-star fr-tl"><use href="#fr-star"/></svg><svg class="fr-star fr-tr"><use href="#fr-star"/></svg>
<svg class="fr-star fr-bl"><use href="#fr-star"/></svg><svg class="fr-star fr-br"><use href="#fr-star"/></svg>
</div>
<audio id="music-track" preload="auto" loop playsinline webkit-playsinline aria-hidden="true"></audio>
<section id="rotate" aria-live="polite"><i aria-hidden="true"></i><span>TURN YOUR PHONE UPRIGHT</span><small>STRUTHIO plays in portrait. The game pauses meanwhile.</small></section>
<button id="update" type="button" hidden aria-label="Update ready: reload to the new version">UPDATE READY</button>
<section id="fatal" hidden role="alert" aria-live="assertive">
<h1>STRUTHIO CANNOT START</h1>
<p class="hint">This game needs WebGPU. Play in a current Chrome or Edge, or Safari 26 or later.</p>
<p class="detail"></p>
<p class="code"></p>
</section>
<noscript><section role="alert" style="color:#FF6B2D;padding:24px">JavaScript is required.</section></noscript>
<script type="module">
import { boot, showFatal } from './src/app/boot.mjs';
// Test flags (seed, freeze, quality, music, globe) are honoured only on a local
// development server; a published host accepts none.
const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
const flags = local ? Object.fromEntries(new URLSearchParams(location.search)) : {};
boot({ flags, local }).then((session) => {
const upd = document.getElementById('update');
setInterval(() => { upd.hidden = !(session.updateReady && !session.game); }, 500);
}).catch(() => {});
window.addEventListener('error', (e) => { if (!document.getElementById('fatal').hidden) return; showFatal('FATAL_SCRIPT', e.message); });
</script>
</body>
</html>
