<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870"><rect width="1600" height="870" fill="#FFFFFF"/><rect x="8" y="8" width="1584" height="854" fill="none" stroke="#17191C" stroke-width="1.5"/><text x="24" y="40" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="22" fill="#17191C" font-weight="800" text-anchor="start">S2  Controls: four contacts on STRUTHIO-CP1, active low</text><text x="24" y="62" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="13" fill="#60656C" font-weight="400" text-anchor="start">The only signal wiring STRUTHIO adds to the board. Internal pull-ups, no external parts. 1 kHz sampling, 8 ms debounce in firmware.</text><rect x="1270" y="812" width="322" height="50" fill="none" stroke="#17191C" stroke-width="1"/><text x="1280" y="832" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12" fill="#17191C" font-weight="700" text-anchor="start">STRUTHIO HANDHELD  ·  wiring</text><text x="1280" y="850" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="start">Waveshare ESP32-S3-Touch-LCD-3.5B</text><g transform="translate(0,-110)"><rect x="120" y="205" width="380" height="560" rx="6" fill="#EAF4F4" stroke="#17191C" stroke-width="1.6"/><text x="310.0" y="227" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">ESP32-S3</text><text x="310" y="745" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">(on the Waveshare 3.5B)</text><text x="290" y="268" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="end">internal pull-up</text><polyline points="300,240 300,246" fill="none" stroke="#C8321E" stroke-width="2" stroke-linejoin="round"/><text x="300" y="234" font-family="Consolas, Menlo, monospace" font-size="11" fill="#C8321E" font-weight="