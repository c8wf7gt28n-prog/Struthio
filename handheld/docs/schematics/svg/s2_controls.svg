"Consolas, Menlo, monospace" font-size="11.5" fill="#17191C" font-weight="600" text-anchor="end"></text><text x="524" y="524" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="10.5" fill="#60656C" font-weight="400" text-anchor="start">header J8-6</text><text x="492" y="522" font-family="Consolas, Menlo, monospace" font-size="12" fill="#17191C" font-weight="700" text-anchor="end">GPIO21</text><polyline points="518,530 800,530" fill="none" stroke="#1F5FBF" stroke-width="2.6" stroke-linejoin="round"/><text x="650" y="548" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="middle">yellow wire → CP1 pad DL</text><line x1="860" y1="530" x2="878" y2="530" stroke="#1F5FBF" stroke-width="2.2"/><line x1="902" y1="530" x2="920" y2="530" stroke="#1F5FBF" stroke-width="2.2"/><circle cx="878" cy="530" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><circle cx="902" cy="530" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><line x1="874" y1="518" x2="906" y2="518" stroke="#17191C" stroke-width="2.2"/><line x1="890" y1="518" x2="890" y2="508" stroke="#17191C" stroke-width="2.2"/><line x1="884" y1="508" x2="896" y2="508" stroke="#17191C" stroke-width="2.2"/><text x="890" y="552" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="700" text-anchor="middle">DART LEFT</text><polyline points="800,530 860,530" fill="none" stroke="#1F5FBF" stroke-width="2.2" stroke-linejoin="round"/><polyline points="920,530 1100,530" fill="none" stroke="#17191C" stroke-width="2.4" stroke-linejoin="round"/><circle cx="1100" cy="530" r="4" fill="#17191C"/><text x="290" y="628" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="end">internal pull-up</text><polyline points="300,600 300,606" fill="none" stroke="#C8321E" stroke-width="2" stroke-linejoin="round"/><text x="300" y="594" font-family="Consolas, Menlo, monospace" font-size="11" fill="#C8321E" font-weight="700" text-anchor="middle">3V3</text><polyline points="300,606 300,612 294,615 306,619 294,623 306,627 294,631 306,635 300,640 300,646" fill="none" stroke="#C8321E" stroke-width="2" stroke-linejoin="round"/><text x="314" y="630" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="start">~45 kΩ</text><polyline points="300,646 300,650 500,650" fill="none" stroke="#1F5FBF" stroke-width="2.2" stroke-linejoin="round"/><circle cx="300" cy="650" r="4" fill="#1F5FBF"/><line x1="500" y1="650" x2="518" y2="650" stroke="#1F5FBF" stroke-width="2.2"/><text x="494" y="654" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#17191C" font-weight="600" text-anchor="end"></text><text x="524" y="644" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="10.5" fill="#60656C" font-weight="400" text-anchor="start">header J8-8</text><text x="492" y="642" font-family="Consolas, Menlo, monospace" font-size="12" fill="#17191C" font-weight="700" text-anchor="end">GPIO38</text><polyline points="518,650 800,650" fill="none" stroke="#1F5FBF" stroke-width="2.6" stroke-linejoin="round"/><text x="650" y="668" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="middle">orange wire → CP1 pad DR</text><line x1="860" y1="650" x2="878" y2="650" stroke="#1F5FBF" stroke-width="2.2"/><line x1="902" y1="650" x2="920" y2="650" stroke="#1F5FBF" stroke-width="2.2"/><circle cx="878" cy="650" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><circle cx="902" cy="650" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><line x1="874" y1="638" x2="906" y2="638" stroke="#17191C" stroke-width="2.2"/><line x1="890" y1="638" x2="890" y2="628" stroke="#17191C" stroke-width="2.2"/><line x1="884" y1="628" x2="896" y2="628" stroke="#17191C" stroke-width="2.2"/><text x="890" y="672" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="700" text-anchor="middle">DART RIGHT</text><polyline points="800,650 860,650" fill="none" stroke="#1F5FBF" stroke-width="2.2" stroke-linejoin="round"/><polyline points="920,650 1100,650" fill="none" stroke="#17191C" stroke-width="2.4" stroke-linejoin="round"/><circle cx="1100" cy="650" r="4" fill="#17191C"/><rect x="780" y="230" width="360" height="510" rx="6" fill="none" stroke="#A7ABB2" stroke-width="1.6" stroke-dasharray="6 4"/><text x="960.0" y="252" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle"></text><text x="960" y="222" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="700" text-anchor="middle">STRUTHIO-CP1: carbon pill on ENIG comb = switch</text><polyline points="1100,290 1100,760" fill="none" stroke="#17191C" stroke-width="2.6" stroke-linejoin="round"/><polyline points="1100,760 1100,800 500,800 500,765" fill="none" stroke="#17191C" stroke-width="2.6" stroke-linejoin="round"/><text x="800" y="822" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="600" text-anchor="middle">black wire: CP1 pad G → board GND, header J8-29 (any GND pin)</text><line x1="1100" y1="800" x2="1100" y2="810" stroke="#17191C" stroke-width="2"/><line x1="1092.0" y1="810" x2="1108.0" y2="810" stroke="#17191C" stroke-width="2"/><line x1="1095.0" y1="814" x2="1105.0" y2="814" stroke="#17191C" stroke-width="2"/><line x1="1098.0" y1="818" x2="1102.0" y2="818" stroke="#17191C" stroke-width="2"/><text x="1190" y="250" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">Pressed  → GPIO reads 0 (LOW)</text><text x="1190" y="266" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">Released → GPIO reads 1 (pull-up)</text><text x="1190" y="282" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start"></text><text x="1190" y="298" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">Wings: one flap per press;</text><text x="1190" y="314" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">both within 100 ms = straight up.</text><text x="1190" y="330" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">DART ends: one dart per press,</text><text x="1190" y="346" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">toward that side.</text><text x="1190" y="362" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start"></text><text x="1190" y="378" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">Bench build: two tact switches</text><text x="1190" y="394" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">on GPIO17/18 + GND are enough;</text><text x="1190" y="410" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">DART mode C (both wings held</text><text x="1190" y="426" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">200 ms) stands in for the rocker.</text><text x="130" y="850" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C8321E" font-weight="400" text-anchor="start">All four lines are camera-FPC pins (17 VSYNC, 18 HREF, 21 D7, 38 XCLK): keep the camera connector EMPTY.</text><line x1="1190" y1="520" x2="1218" y2="520" stroke="#C8321E" stroke-width="3"/><text x="1226" y="524" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">power</text><line x1="1190" y1="538" x2="1218" y2="538" stroke="#17191C" stroke-width="3"/><text x="1226" y="542" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">ground</text><line x1="1190" y1="556" x2="1218" y2="556" stroke="#1F5FBF" stroke-width="3"/><text x="1226" y="560" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">GPIO signal</text><line x1="1190" y1="574" x2="1218" y2="574" stroke="#60656C" stroke-width="2" stroke-dasharray="7 5"/><text x="1226" y="578" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">proposal / confirm on the board</text></g></svg>