<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="910" viewBox="0 0 1600 910"><rect width="1600" height="910" fill="#FFFFFF"/><rect x="8" y="8" width="1584" height="894" fill="none" stroke="#17191C" stroke-width="1.5"/><text x="24" y="40" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="22" fill="#17191C" font-weight="800" text-anchor="start">S3  Power: USB-C, LiPo and the slide POWER switch</text><text x="24" y="62" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="13" fill="#60656C" font-weight="400" text-anchor="start">The board's AXP2101 does charging and rails. STRUTHIO adds a panel USB-C extension, one protected LiPo and a slide switch (two wiring options).</text><rect x="1270" y="852" width="322" height="50" fill="none" stroke="#17191C" stroke-width="1"/><text x="1280" y="872" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12" fill="#17191C" font-weight="700" text-anchor="start">STRUTHIO HANDHELD  ·  A0 / A1 wiring</text><text x="1280" y="890" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="start">Waveshare ESP32-S3-Touch-LCD-3.5B  ·  manual v0.10</text><g transform="translate(0,-90)"><rect x="60" y="170" width="220" height="90" rx="6" fill="#EEF6EA" stroke="#17191C" stroke-width="1.6"/><text x="170.0" y="192" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">USB-C panel jack</text><text x="170.0" y="210" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">bottom of the shell</text><text x="170.0" y="225" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">short full-data extension</text><polyline points="280,215 430,215" fill="none" stroke="#3B7D23" stroke-width="4" stroke-linejoin="round"/><text x="355" y="205" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="middle">VBUS · D+/D- · GND</text><rect x="430" y="170" width="220" height="90" rx="6" fill="#EEF6EA" stroke="#17191C" stroke-width="1.6"/><text x="540.0" y="192" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">board USB-C</text><text x="540.0" y="210" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">GPIO19/20 native USB</text><text x="540.0" y="225" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">VBUS 5 V in</text><polyline points="650,215 760,215 760,300" fill="none" stroke="#C8321E" stroke-width="3" stroke-linejoin="round"/><rect x="640" y="300" width="380" height="300" rx="6" fill="#FBEFEA" stroke="#17191C" stroke-width="1.6"/><text x="830.0" y="322" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">AXP2101 PMIC</text><text x="830.0" y="340" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">I2C 0x34 · board_pmu.cpp</text><text x="830.0" y="355" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">VBUS limit 4.36 V / 1.5 A</text><text x="830.0" y="370" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">charger 200 mA, 4.1 V target</text><text x="830.0" y="385" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">power key: 128 ms on, 4 s off</text><text x="830.0" y="400" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">rails as the vendor example:</text><text x="830.0" y="415" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">DC1-5, ALDO1-4, BLDO1-2,</text><text x="830.0" y="430" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">DLDO1-2, CPUSLDO all on</text><polyline points="1020,360 1150,360" fill="none" stroke="#C8321E" stroke-width="3.5" stroke-linejoin="round"/><rect x="1150" y="320" width="280" height="80" rx="6" fill="#FBEFEA" stroke="#17191C" stroke-width="1.6"/><text x="1290.0" y="342" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">3.3 V system + rails</text><text x="1290.0" y="360" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">ESP32-S3, LCD, codec, ...</text><text x="1290.0" y="375" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">(consumer per rail: schematic)</text><line x1="1020" y1="470" x2="1038" y2="470" stroke="#1F5FBF" stroke-width="2.2"/><text x="1014" y="474" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#17191C" font-weight="600" text-anchor="end">PWRON</text><polyline points="1038,470 1150,470" fill="none" stroke="#1F5FBF" stroke-width="2.2" stroke-linejoin="round"/><rect x="1150" y="440" width="280" height="60" rx="6" fill="#F4F4F1" stroke="#17191C" stroke-width="1.6"/><text x="1290.0" y="462" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">board PWR key</text><text x="1290.0" y="480" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">momentary · service slot</text><text x="120" y="330" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="14" fill="#17191C" font-weight="800" text-anchor="start">OPTION A  ·  switch in the battery lead (simplest, true off)</text><line x1="170" y1="380" x2="170" y2="398" stroke="#C8321E" stroke-width="2.4"/><line x1="154" y1="398" x2="186" y2="398" stroke="#17191C" stroke-width="2.6"/><line x1="162" y1="406" x2="178" y2="406" stroke="#17191C" stroke-width="5"/><line x1="170" y1="406" x2="170" y2="430" stroke="#17191C" stroke-width="2.4"/><text x="192" y="396" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="14" fill="#C8321E" font-weight="800" text-anchor="start">+</text><text x="196" y="410" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="600" text-anchor="start">LiPo, 1 cell, protected</text><text x="196" y="424" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">protection PCB on the cell</text><text x="196" y="438" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">polarity: check before plugging</text><polyline points="170,380 170,360 300,360" fill="none" stroke="#C8321E" stroke-width="3" stroke-linejoin="round"/><line x1="300" y1="360" x2="318" y2="360" stroke="#C8321E" stroke-width="2.4"/><line x1="344" y1="360" x2="360" y2="360" stroke="#C8321E" stroke-width="2.4"/><circle cx="318" cy="360" r="3" fill="#17191C"/><circle cx="344" cy="360" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><line x1="318" y1="360" x2="342" y2="346" stroke="#17191C" stroke-width="2.4"/><text x="330" y="382" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="700" text-anchor="middle">SLIDE POWER</text><polyline points="360,360 560,360 560,420 640,420" fill="none" stroke="#C8321E" stroke-width="3" stroke-linejoin="round"/><text x="570" y="412" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#C8321E" font-weight="700" text-anchor="start">BAT+</text><polyline points="170,430 170,470 560,470 560,450 640,450" fill="none" stroke="#17191C" stroke-width="3" stroke-linejoin="round"/><text x="570" y="444" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#17191C" font-weight="700" text-anchor="start">BAT-</text><text x="120" y="500" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">Switch in BAT+ only, never BAT-. Rated for the peak current (≥ 2 A).</text><text x="120" y="516" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">OFF: battery disconnected, zero drain. With USB in, the board still</text><text x="120" y="532" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">runs from VBUS, but charging needs the switch ON.</text><text x="120" y="620" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="14" fill="#17191C" font-weight="800" text-anchor="start">OPTION B  ·  switch as a signal (keeps charging when OFF)</text><rect x="120" y="650" width="220" height="150" rx="6" fill="#EAF4F4" stroke="#17191C" stroke-width="1.6"/><text x="230.0" y="672" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">ESP32-S3</text><text x="230.0" y="690" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">spare GPIO, e.g. 21</text><text x="230.0" y="705" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">(no camera fitted)</text><line x1="340" y1="700" x2="358" y2="700" stroke="#1F5FBF" stroke-width="2.2"/><text x="334" y="704" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#17191C" font-weight="600" text-anchor="end">GPIO21</text><polyline points="358,700 430,700" fill="none" stroke="#1F5FBF" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="7 5"/><line x1="430" y1="700" x2="448" y2="700" stroke="#1F5FBF" stroke-width="2.4"/><line x1="474" y1="700" x2="490" y2="700" stroke="#1F5FBF" stroke-width="2.4"/><circle cx="448" cy="700" r="3" fill="#17191C"/><circle cx="474" cy="700" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><line x1="448" y1="700" x2="472" y2="686" stroke="#17191C" stroke-width="2.4"/><text x="460" y="722" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="700" text-anchor="middle">SLIDE POWER</text><polyline points="490,700 560,700 560,740" fill="none" stroke="#17191C" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="7 5"/><line x1="560" y1="740" x2="560" y2="750" stroke="#17191C" stroke-width="2"/><line x1="552.0" y1="750" x2="568.0" y2="750" stroke="#17191C" stroke-width="2"/><line x1="555.0" y1="754" x2="565.0" y2="754" stroke="#17191C" stroke-width="2"/><line x1="558.0" y1="758" x2="562.0" y2="758" stroke="#17191C" stroke-width="2"/><text x="620" y="680" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">Pull-up on; switch closes to GND = ON. When it opens, firmware asks the AXP2101 to</text><text x="620" y="696" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">power down (board_power_off). The PWR key or USB-in wakes it. Battery stays</text><text x="620" y="712" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">connected and charges in either position. Needs firmware (not written yet).</text><text x="620" y="760" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="start">Battery lead and BAT connector: the board's own LiPo connector (type, pitch and polarity</text><text x="620" y="776" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="start">from the vendor drawing; confirm before crimping).</text><line x1="1240" y1="600" x2="1268" y2="600" stroke="#C8321E" stroke-width="3"/><text x="1276" y="604" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">power</text><line x1="1240" y1="618" x2="1268" y2="618" stroke="#17191C" stroke-width="3"/><text x="1276" y="622" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">ground</text><line x1="1240" y1="636" x2="1268" y2="636" stroke="#1F5FBF" stroke-width="3"/><text x="1276" y="640" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">GPIO signal</text><line x1="1240" y1="654" x2="1268" y2="654" stroke="#3B7D23" stroke-width="3"/><text x="1276" y="658" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">USB</text><line x1="1240" y1="672" x2="1268" y2="672" stroke="#60656C" stroke-width="2" stroke-dasharray="7 5"/><text x="1276" y="676" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">proposal / confirm on the board</text><text x="1240" y="720" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#C8321E" font-weight="400" text-anchor="start">Never connect AA / NiMH packs</text><text x="1240" y="736" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#C8321E" font-weight="400" text-anchor="start">to the LiPo connector: the</text><text x="1240" y="752" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#C8321E" font-weight="400" text-anchor="start">charger would try to charge them.</text></g></svg>