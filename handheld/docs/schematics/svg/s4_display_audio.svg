<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><rect width="1600" height="880" fill="#FFFFFF"/><rect x="8" y="8" width="1584" height="864" fill="none" stroke="#17191C" stroke-width="1.5"/><text x="24" y="40" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="22" fill="#17191C" font-weight="800" text-anchor="start">S4  Display and audio: on-board wiring the firmware drives</text><text x="24" y="62" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="13" fill="#60656C" font-weight="400" text-anchor="start">Not wired by hand: these traces are on the Waveshare board. Shown so bring-up can probe them. Values from board_waveshare_35b.c / the vendor BSP.</text><rect x="1270" y="822" width="322" height="50" fill="none" stroke="#17191C" stroke-width="1"/><text x="1280" y="842" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12" fill="#17191C" font-weight="700" text-anchor="start">STRUTHIO HANDHELD  ·  wiring</text><text x="1280" y="860" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="start">Waveshare ESP32-S3-Touch-LCD-3.5B</text><g transform="translate(0,-60)"><rect x="120" y="160" width="330" height="640" rx="6" fill="#EAF4F4" stroke="#17191C" stroke-width="1.6"/><text x="285.0" y="182" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">ESP32-S3</text><text x="285.0" y="200" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">SPI2 · LEDC · I2C0 · I2S0</text><rect x="780" y="160" width="330" height="290" rx="6" fill="#E6F4F4" stroke="#17191C" stroke-width="1.6"/><text x="945.0" y="182" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">AXS15231B display</text><text x="945.0" y="200" font-family="Aptos, Helvetica, Arial, sans-serif" font-s