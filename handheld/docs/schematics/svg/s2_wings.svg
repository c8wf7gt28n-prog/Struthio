<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790"><rect width="1600" height="790" fill="#FFFFFF"/><rect x="8" y="8" width="1584" height="774" fill="none" stroke="#17191C" stroke-width="1.5"/><text x="24" y="40" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="22" fill="#17191C" font-weight="800" text-anchor="start">S2  Wing buttons: GPIO17 / GPIO18, active low</text><text x="24" y="62" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="13" fill="#60656C" font-weight="400" text-anchor="start">The only wiring STRUTHIO adds to the board. Internal pull-ups; no external parts needed. 1 kHz sampling, 8 ms debounce in firmware.</text><rect x="1270" y="732" width="322" height="50" fill="none" stroke="#17191C" stroke-width="1"/><text x="1280" y="752" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12" fill="#17191C" font-weight="700" text-anchor="start">STRUTHIO HANDHELD  ·  A0 / A1 wiring</text><text x="1280" y="770" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="start">Waveshare ESP32-S3-Touch-LCD-3.5B  ·  manual v0.10</text><g transform="translate(0,-110)"><rect x="120" y="205" width="380" height="415" rx="6" fill="#EAF4F4" stroke="#17191C" stroke-width="1.6"/><text x="310.0" y="227" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">ESP32-S3</text><text x="310" y="600" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">(on the Waveshare 3.5B)</text><text x="290" y="278" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="end">internal pull-up</text><polyline points="300,250 300,256" fill="none" stroke="#C8321E" stroke-width="2" stroke-linejoin="round"/><text x="300" y="244" font-family="Consolas, Menlo, monospace" font-size="11" fill="#C8321E" font-weight="700" text-anchor="middle">3V3</text><polyline points="300,256 300,262 294,265 306,269 294,273 306,277 294,281 306,285 300,290 300,296" fill="none" stroke="#C8321E" stroke-width="2" stroke-linejoin="round"/><text x="314" y="280" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="start">~45 kΩ</text><polyline points="300,296 300,300 500,300" fill="none" stroke="#1F5FBF" stroke-width="2.2" stroke-linejoin="round"/><circle cx="300" cy="300" r="4" fill="#1F5FBF"/><line x1="500" y1="300" x2="518" y2="300" stroke="#1F5FBF" stroke-width="2.2"/><text x="494" y="304" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#17191C" font-weight="600" text-anchor="end"></text><text x="524" y="294" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="10.5" fill="#60656C" font-weight="400" text-anchor="start">header pin 16</text><text x="492" y="292" font-family="Consolas, Menlo, monospace" font-size="12" fill="#17191C" font-weight="700" text-anchor="end">GPIO17</text><polyline points="518,300 760,300" fill="none" stroke="#1F5FBF" stroke-width="2.6" stroke-linejoin="round"/><text x="680" y="318" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="middle">white wire (proposal)</text><rect x="760" y="230" width="330" height="140" rx="6" fill="#FFF6E0" stroke="#17191C" stroke-width="1.6"/><text x="925.0" y="252" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">LEFT WING switch board</text><text x="925.0" y="270" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">~18 x 18 mm perfboard</text><text x="925.0" y="285" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">Omron B3F-4050 (or rubber dome)</text><line x1="860" y1="330" x2="878" y2="330" stroke="#1F5FBF" stroke-width="2.2"/><line x1="902" y1="330" x2="920" y2="330" stroke="#1F5FBF" stroke-width="2.2"/><circle cx="878" cy="330" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><circle cx="902" cy="330" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><line x1="874" y1="318" x2="906" y2="318" stroke="#17191C" stroke-width="2.2"/><line x1="890" y1="318" x2="890" y2="308" stroke="#17191C" stroke-width="2.2"/><line x1="884" y1="308" x2="896" y2="308" stroke="#17191C" stroke-width="2.2"/><text x="890" y="352" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="700" text-anchor="middle">SW L</text><polyline points="780,300 780,330 860,330" fill="none" stroke="#1F5FBF" stroke-width="2.2" stroke-linejoin="round"/><polyline points="920,330 1060,330 1060,390 1180,390" fill="none" stroke="#17191C" stroke-width="2.4" stroke-linejoin="round"/><text x="290" y="448" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="end">internal pull-up</text><polyline points="300,420 300,426" fill="none" stroke="#C8321E" stroke-width="2" stroke-linejoin="round"/><text x="300" y="414" font-family="Consolas, Menlo, monospace" font-size="11" fill="#C8321E" font-weight="700" text-anchor="middle">3V3</text><polyline points="300,426 300,432 294,435 306,439 294,443 306,447 294,451 306,455 300,460 300,466" fill="none" stroke="#C8321E" stroke-width="2" stroke-linejoin="round"/><text x="314" y="450" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="start">~45 kΩ</text><polyline points="300,466 300,470 500,470" fill="none" stroke="#1F5FBF" stroke-width="2.2" stroke-linejoin="round"/><circle cx="300" cy="470" r="4" fill="#1F5FBF"/><line x1="500" y1="470" x2="518" y2="470" stroke="#1F5FBF" stroke-width="2.2"/><text x="494" y="474" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#17191C" font-weight="600" text-anchor="end"></text><text x="524" y="464" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="10.5" fill="#60656C" font-weight="400" text-anchor="start">header pin 18</text><text x="492" y="462" font-family="Consolas, Menlo, monospace" font-size="12" fill="#17191C" font-weight="700" text-anchor="end">GPIO18</text><polyline points="518,470 760,470" fill="none" stroke="#1F5FBF" stroke-width="2.6" stroke-linejoin="round"/><text x="680" y="488" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11" fill="#60656C" font-weight="400" text-anchor="middle">blue wire (proposal)</text><rect x="760" y="400" width="330" height="140" rx="6" fill="#FFF6E0" stroke="#17191C" stroke-width="1.6"/><text x="925.0" y="422" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="15" fill="#17191C" font-weight="800" text-anchor="middle">RIGHT WING switch board</text><text x="925.0" y="440" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">~18 x 18 mm perfboard</text><text x="925.0" y="455" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60656C" font-weight="400" text-anchor="middle">Omron B3F-4050 (or rubber dome)</text><line x1="860" y1="500" x2="878" y2="500" stroke="#1F5FBF" stroke-width="2.2"/><line x1="902" y1="500" x2="920" y2="500" stroke="#1F5FBF" stroke-width="2.2"/><circle cx="878" cy="500" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><circle cx="902" cy="500" r="3" fill="#FFFFFF" stroke="#17191C" stroke-width="1.8"/><line x1="874" y1="488" x2="906" y2="488" stroke="#17191C" stroke-width="2.2"/><line x1="890" y1="488" x2="890" y2="478" stroke="#17191C" stroke-width="2.2"/><line x1="884" y1="478" x2="896" y2="478" stroke="#17191C" stroke-width="2.2"/><text x="890" y="522" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="700" text-anchor="middle">SW R</text><polyline points="780,470 780,500 860,500" fill="none" stroke="#1F5FBF" stroke-width="2.2" stroke-linejoin="round"/><polyline points="920,500 1060,500 1060,560 1180,560" fill="none" stroke="#17191C" stroke-width="2.4" stroke-linejoin="round"/><polyline points="1180,390 1180,560" fill="none" stroke="#17191C" stroke-width="2.6" stroke-linejoin="round"/><circle cx="1180" cy="390" r="4" fill="#17191C"/><circle cx="1180" cy="560" r="4" fill="#17191C"/><polyline points="1180,560 1180,700 500,700 500,620" fill="none" stroke="#17191C" stroke-width="2.6" stroke-linejoin="round"/><text x="840" y="690" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="600" text-anchor="middle">black wire: GND, header pin 30 (any GND pin)</text><line x1="1180" y1="700" x2="1180" y2="710" stroke="#17191C" stroke-width="2"/><line x1="1172.0" y1="710" x2="1188.0" y2="710" stroke="#17191C" stroke-width="2"/><line x1="1175.0" y1="714" x2="1185.0" y2="714" stroke="#17191C" stroke-width="2"/><line x1="1178.0" y1="718" x2="1182.0" y2="718" stroke="#17191C" stroke-width="2"/><text x="1220" y="230" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">Pressed  → GPIO reads 0 (LOW)</text><text x="1220" y="246" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">Released → GPIO reads 1 (pull-up)</text><text x="1220" y="262" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start"></text><text x="1220" y="278" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">Firmware: gpio_config INPUT,</text><text x="1220" y="294" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">pull_up_en, active level 0;</text><text x="1220" y="310" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">1 kHz sample, 8 ms stable,</text><text x="1220" y="326" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">raw-edge time kept for the</text><text x="1220" y="342" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">100 ms straight-up chord.</text><text x="1220" y="358" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start"></text><text x="1220" y="374" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">DART (trial C) needs no wire:</text><text x="1220" y="390" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#17191C" font-weight="400" text-anchor="start">both wings held 200 ms.</text><text x="130" y="650" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C8321E" font-weight="400" text-anchor="start">Both lines are the camera FPC's VSYNC (17) / HREF (18):</text><text x="130" y="666" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C8321E" font-weight="400" text-anchor="start">keep the camera connector EMPTY.</text><text x="130" y="760" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12" fill="#60656C" font-weight="400" text-anchor="start">Optional per line, only if bench tests show noise: 100 nF from GPIO to GND</text><text x="130" y="776" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="12" fill="#60656C" font-weight="400" text-anchor="start">and/or an external 10 kΩ pull-up to 3V3. Not fitted by default.</text><line x1="1220" y1="470" x2="1248" y2="470" stroke="#C8321E" stroke-width="3"/><text x="1256" y="474" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">power</text><line x1="1220" y1="488" x2="1248" y2="488" stroke="#17191C" stroke-width="3"/><text x="1256" y="492" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">ground</text><line x1="1220" y1="506" x2="1248" y2="506" stroke="#1F5FBF" stroke-width="3"/><text x="1256" y="510" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">GPIO signal</text><line x1="1220" y1="524" x2="1248" y2="524" stroke="#60656C" stroke-width="2" stroke-dasharray="7 5"/><text x="1256" y="528" font-family="Aptos, Helvetica, Arial, sans-serif" font-size="11.5" fill="#17191C" font-weight="400" text-anchor="start">proposal / confirm on the board</text></g></svg>